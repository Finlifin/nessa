[package]
name = "nessa-fmt"
version = "0.1.0"
edition = "2024"

[lib]
name = "nessa_fmt"
path = "src/lib.rs"

[[bin]]
name = "nessa-fmt"
path = "src/main.rs"

[dependencies]
ast = { path = "../ast" }
diagnostic = { path = "../diagnostic" }
lexer = { path = "../lexer" }
parser = { path = "../parser" }
rustc_span = { workspace = true }
source_span = { path = "../source_span" }
str_interner = { path = "../str_interner" }
